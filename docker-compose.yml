version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: pkml-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: pkml-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGO_URL=mongodb://mongo:27017
      - DB_NAME=pkml
      - CORS_ORIGINS=http://localhost:3000
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    container_name: pkml-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  mongo_data:
